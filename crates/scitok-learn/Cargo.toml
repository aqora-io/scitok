[package]
name = "scitok-learn"
description = "Harvest arXiv and learn scitok domain data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
scitok = { path = "../scitok", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = "1.1"
quick-xml = "0.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
toml = "1.1"
ureq = "3.3"
